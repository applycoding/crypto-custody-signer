name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      vault:
        image: hashicorp/vault:1.17
        env:
          VAULT_DEV_ROOT_TOKEN_ID: root
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports: ["8200:8200"]
    env:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install SoftHSM2
        run: sudo apt-get update && sudo apt-get install -y softhsm2
      - name: Enable Vault transit
        run: |
          for i in $(seq 1 30); do curl -fs $VAULT_ADDR/v1/sys/health && break; sleep 1; done
          curl -fs -X POST -H "X-Vault-Token: root" -d '{"type":"transit"}' $VAULT_ADDR/v1/sys/mounts/transit
      - run: go vet ./...
      - name: Unit tests (race)
        run: go test -race ./...
      - name: PKCS#11 tests against SoftHSM2 and Vault integration
        run: |
          eval "$(./scripts/softhsm-init.sh)"
          go test -tags pkcs11 -v ./internal/signer/ ./internal/attest/
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t crypto-custody-signer .
