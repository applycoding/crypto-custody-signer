# custodyd plus a Vault dev server for policy attestations (dev mode: in memory, root token "root").
services:
  vault:
    image: hashicorp/vault:1.17
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports: ["8200:8200"]
  vault-init:
    image: hashicorp/vault:1.17
    depends_on: [vault]
    environment: { VAULT_ADDR: "http://vault:8200", VAULT_TOKEN: root }
    entrypoint: ["sh", "-c", "sleep 2 && vault secrets enable transit || true"]
  custodyd:
    build: .
    depends_on: [vault-init]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
    ports: ["8080:8080"]
    restart: on-failure
